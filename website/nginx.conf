server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    # The platform reverse proxy owns access logging and the 30-day retention.
    access_log off;
    error_log /dev/stderr warn;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'none'; img-src 'self'; style-src 'self'; font-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    location = / { return 302 /de/; }
    # Stable, language-neutral links for future store listing fields.
    location = /impressum { return 301 /de/impressum/; }
    location = /impressum/ { return 301 /de/impressum/; }
    location = /datenschutz { return 301 /de/datenschutz/; }
    location = /datenschutz/ { return 301 /de/datenschutz/; }
    location = /privacy { return 301 /en/privacy/; }
    location = /privacy/ { return 301 /en/privacy/; }
    location / { try_files $uri $uri/ =404; }
    error_page 404 /404.html;
    location = /404.html { internal; }
}
